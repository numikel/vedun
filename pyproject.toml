[project]
name = "vedun"
version = "0.1.0"
description = "Local knowledge base for a collection of standards and technical documents: exact, cited answers with a web dashboard, REST API and MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "sqlite-vec",
    "pyyaml",
    "pypdfium2",
]

[project.optional-dependencies]
# PDF -> Markdown conversion (Docling pulls torch: ~3 GB); not needed to search an existing knowledge base
convert = ["docling"]
# REST API, dashboard and MCP server
server = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pillow>=11",  # downscales large figure PNGs for MCP clients
]
# Jev reranker (TypeSafe); without it search keeps the fused order
jev = ["jev-reranker>=0.1.2"]
all = ["vedun[convert,server,jev]"]

[project.scripts]
vedun = "vedun.cli:main"

[dependency-groups]
# lint + tests: needs only the server extras at run time (Docling and Jev are imported lazily)
test = ["pytest", "ruff"]
dev = [{ include-group = "test" }, "vedun[all]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
