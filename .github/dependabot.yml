version: 2
updates:
  # actions are pinned to commit SHAs; Dependabot proposes updates (SHA + version comment) as pull requests
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # a new Python minor needs wheels for every dependency (tree-sitter had none for 3.15): move it by hand with CI
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
