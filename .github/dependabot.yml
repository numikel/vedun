version: 2
updates:
  # actions are pinned to commit SHAs; Dependabot proposes updates (SHA + version comment) as pull requests
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
