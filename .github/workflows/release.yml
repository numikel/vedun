name: Release image

# A tag like v0.1.0 publishes ghcr.io/<owner>/vedun:0.1.0, :0.1 and :latest for linux/amd64 and linux/arm64; a
# pre-release such as v0.2.0-rc1 publishes only :0.2.0-rc1, so :latest and :0.2 never point at an unfinished build
# (Apple Silicon runs the arm64 image natively). Each platform is built on a native runner, then the digests are
# merged into one multi-platform tag.
# A manual run (Actions → Release image → Run workflow) is a dry run: it builds both platforms and computes the tags
# for a sample version, but never logs in to or pushes to the registry. Only a pushed tag publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: sample version the dry run computes tags for (nothing is published)
        default: v0.0.0

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vedun

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: platform slug
        run: echo "SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=vedun: local knowledge base with cited answers, dashboard, REST API and MCP
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ env.SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.SLUG }}
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          name="${DIGEST#sha256:}"
          if [ -z "$name" ]; then
            [ "$EVENT" = push ] && { echo "::error::build returned no digest"; exit 1; }
            name="dry-run-$SLUG"
          fi
          touch "/tmp/digests/$name"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EVENT: ${{ github.event_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ env.SLUG }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # on a tag push `value` is empty and the semver rules read the git tag; a dry run feeds them the sample version
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
        # no latest rule: flavor latest=auto adds :latest for every stable semver tag and skips pre-releases
      - name: create the multi-platform tags
        if: github.event_name == 'push'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: inspect
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
      - name: dry run summary
        if: github.event_name != 'push'
        run: |
          tags=$(jq -r '.tags | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=$(ls /tmp/digests | wc -l)
          echo "tags: $tags"
          echo "platform digests: $digests"
          [ -n "$tags" ] && [ "$digests" -eq 2 ] || { echo "::error::expected tags and 2 platform digests"; exit 1; }
